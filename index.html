<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>나의 독서 서재</title>
<style>
:root{--bg:#f8f7f3;--card:#fff;--ink:#25332e;--sub:#75817b;--accent:#397c64;--light:#e8f4ec;--line:#e5e8e2;--warn:#b96c34;--red:#b74d55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:1100px;padding:20px 17px 90px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:5px 0 23px}h1{margin:0;font-size:27px}h2{font-size:20px;margin:0 0 13px}h3{margin:0 0 8px;font-size:16px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:800}.muted{color:var(--sub);font-size:13px}.btn{border:1px solid var(--line);padding:10px 14px;border-radius:11px;background:white;color:var(--ink);font-weight:650}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px}.stat .n{font-size:28px;font-weight:850;margin:8px 0 2px}.stat .label{font-size:12px;color:var(--sub)}.tabs{display:flex;gap:7px;overflow-x:auto;margin:18px 0;scrollbar-width:none}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:100px}.tab.on{background:var(--ink);color:#fff}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:15px}.toolbar input{flex:1;min-width:180px}.field{width:100%;padding:11px 12px;background:white;color:var(--ink);border:1px solid #d9dfd8;border-radius:10px;outline-color:var(--accent)}label{font-size:13px;font-weight:650;display:block;margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}.book{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;min-width:0}.book:hover{border-color:#8ab7a3}.cover{height:190px;object-fit:contain;width:100%;border-radius:8px;background:#eff0e8}.placeholder{display:flex;align-items:center;justify-content:center;background:#e5eee6;color:#5b8270;font-size:41px}.booktitle{font-weight:750;font-size:14px;margin:9px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.tag{background:#f1f2f0;padding:4px 6px;border-radius:6px;font-size:10px;color:#526359}.tag.green{background:var(--light);color:var(--accent)}.tag.orange{background:#fff0dc;color:#986023}.progress{height:7px;border-radius:10px;background:#e8eae6;overflow:hidden;margin:8px 0}.progress>div{height:100%;background:var(--accent)}.flex{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.hidden{display:none!important}.empty{text-align:center;color:var(--sub);padding:45px 10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.section{margin-top:18px}.detailtop{display:flex;gap:18px}.detailcover{height:190px;width:125px;object-fit:contain;background:#eef0e9;border-radius:8px}.line{border:0;border-top:1px solid var(--line);margin:18px 0}.modalback{position:fixed;inset:0;background:#13241c9c;display:flex;justify-content:center;align-items:center;padding:15px;z-index:10}.modal{background:#fff;border-radius:19px;width:min(100%,650px);max-height:92vh;overflow:auto;padding:21px}.modalhead{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:15px}.formrow{margin-bottom:13px}.formrow .muted{margin:5px 0}.alert{background:#fff3e6;color:#98571d;padding:10px;border-radius:10px;font-size:13px}.success{background:var(--light);color:var(--accent);padding:10px;border-radius:10px;font-size:13px}.record{border-top:1px solid var(--line);padding:10px 0;font-size:13px}.chart{display:flex;align-items:end;gap:7px;height:145px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-top:14px}.barcol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;position:relative}.bar{background:#6eae91;min-height:2px;width:60%;border-radius:5px 5px 0 0}.barlabel{position:absolute;top:100%;font-size:10px;color:var(--sub);padding-top:5px}.barvalue{font-size:10px;color:var(--sub);margin-bottom:3px}video{width:100%;max-height:280px;background:#1e2724;border-radius:12px}.stickyactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}textarea{min-height:85px;resize:vertical}.footer{font-size:12px;color:var(--sub);text-align:center;margin-top:25px}@media(max-width:610px){.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:13px}.stat .n{font-size:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cover{height:156px}.two{grid-template-columns:1fr}.modal{padding:16px}.detailcover{height:150px;width:95px}header h1{font-size:23px}.wrap{padding-top:15px}}
</style></head><body><div class="wrap">
<header><div><div class="eyebrow">MY BOOK LIBRARY</div><h1>📚 나의 독서 서재</h1><div class="muted">나만의 책장과 독서 기록</div></div><div class="flex"><span id="syncBadge" class="muted">연결 대기</span><button class="btn small hidden" id="logoutButton">로그아웃</button><button class="btn primary" id="addTop">＋ 책 등록</button></div></header>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"><button class="tab on" data-tab="all">전체 책장</button><button class="tab" data-tab="owned">내 소장</button><button class="tab" data-tab="borrowed">빌린 책</button><button class="tab" data-tab="lent">빌려준 책</button><button class="tab" data-tab="wishlist">위시리스트</button><button class="tab" data-tab="report">독서 통계</button><button class="tab" data-tab="settings">설정·백업</button></div>
<main id="main"></main><div class="footer" id="cloudFooter">🔒 로그인 후 PC와 갤럭시에서 같은 기록을 사용합니다.</div></div>
<div id="overlay" class="hidden"></div><script>
'use strict';const STORE='reading-library-v1';let db=load(),tab='all',search='',filter='all',scanStream=null,scanTimer=null,zxingReader=null,continuous=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();function load(){try{let v=JSON.parse(localStorage.getItem(STORE));if(v&&Array.isArray(v.books)&&Array.isArray(v.logs))return v}catch{}return {books:[],logs:[],goal:12}}function save(){if(!cloudUser)throw Error("로그인이 필요해요.");queueSync(JSON.parse(JSON.stringify(db)))}const statusName={planned:'읽기 전',reading:'읽는 중',finished:'완독'};const typeName={owned:'내 소장',borrowed:'빌린 책',lent:'빌려준 책',wishlist:'위시리스트'};const pct=b=>b.pages>0?Math.min(100,Math.round((b.current||0)/b.pages*100)):(b.status==='finished'?100:0);function bookTag(b){return `<span class="tag ${b.type==='owned'?'green':b.type==='borrowed'?'orange':''}">${typeName[b.type]||'기타'}</span><span class="tag">${statusName[b.status]||'읽기 전'}</span>`}function cover(b,cl='cover'){return b.cover?`<img class="${cl}" loading="lazy" referrerpolicy="no-referrer" src="${esc(b.cover)}" alt="${esc(b.title)} 표지" onerror="this.outerHTML='<div class=&quot;${cl} placeholder&quot;>📖</div>'">`:`<div class="${cl} placeholder">📖</div>`}
function render(){let now=new Date(),ym=now.toISOString().slice(0,7),finished=db.books.filter(b=>b.status==='finished').length,month=db.logs.filter(l=>l.date.startsWith(ym)),monthPages=month.reduce((n,l)=>n+(+l.pages||0),0);$('stats').innerHTML=[['소장한 책',db.books.filter(b=>b.type==='owned'||b.type==='lent').length+'권'],['빌린 책',db.books.filter(b=>b.type==='borrowed').length+'권'],['완독한 책',finished+'권'],['이번 달 독서',monthPages+'쪽']].map(([l,n])=>`<div class="stat"><div class="label">${l}</div><div class="n">${n}</div></div>`).join('');document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.dataset.tab===tab));if(tab==='report'){report();return}if(tab==='settings'){settings();return}let list=db.books.filter(b=>(tab==='all'||b.type===tab)&&(filter==='all'||b.status===filter)&&[b.title,b.author,b.isbn,b.publisher].join(' ').toLowerCase().includes(search.toLowerCase()));$('main').innerHTML=`<div class="toolbar"><input class="field" id="bookSearch" placeholder="제목·저자·ISBN 검색" value="${esc(search)}"><select class="field" id="statusFilter" style="width:auto"><option value="all">독서 상태 전체</option><option value="planned">읽기 전</option><option value="reading">읽는 중</option><option value="finished">완독</option></select><button class="btn" id="addMain">＋ 책 추가</button></div><div class="grid">${list.map(b=>`<article class="book" data-book="${esc(b.id)}" tabindex="0" role="button">${cover(b)}<div class="booktitle">${esc(b.title)}</div><div class="muted">${esc(b.author||'저자 미상')}</div><div class="tags">${bookTag(b)}</div><div class="progress"><div style="width:${pct(b)}%"></div></div><div class="muted">${b.pages?`${+b.current||0} / ${b.pages}쪽`:`${pct(b)}%`}${b.type==='borrowed'&&b.due?` · 반납 ${esc(b.due)}`:''}</div></article>`).join('')}</div>${list.length?'':'<div class="empty">📖 아직 표시할 책이 없어요.<p>＋ 책 등록을 눌러 첫 책을 추가해 보세요.</p></div>'}`;$('bookSearch').addEventListener('input',e=>{search=e.target.value;let pos=e.target.selectionStart;render();$('bookSearch').focus();$('bookSearch').setSelectionRange(pos,pos)});$('statusFilter').value=filter;$('statusFilter').onchange=e=>{filter=e.target.value;render()};$('addMain').onclick=()=>editBook();document.querySelectorAll('[data-book]').forEach(e=>{e.onclick=()=>detail(e.dataset.book);e.onkeydown=x=>{if(x.key==='Enter')detail(e.dataset.book)}})}
function modal(inner){$('overlay').className='modalback';$('overlay').innerHTML=`<div class="modal" role="dialog" aria-modal="true">${inner}</div>`;let x=$('closeModal');if(x)x.onclick=closeModal}function closeModal(){stopScan();$('overlay').className='hidden';$('overlay').innerHTML=''}$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('overlay').className!=='hidden')closeModal()});$('addTop').onclick=()=>editBook();$('tabs').onclick=e=>{let v=e.target.closest('[data-tab]');if(v){tab=v.dataset.tab;search='';filter='all';render()}};
function bookForm(b={}){return `<div class="modalhead"><div><h2>${b.id?'책 수정':'새 책 등록'}</h2><div class="muted">ISBN 검색 또는 직접 입력</div></div><button class="btn small" id="closeModal">닫기 ✕</button></div><div class="formrow"><label>ISBN (책 뒷면 바코드)</label><div class="flex"><input class="field" id="isbn" inputmode="numeric" placeholder="978..." value="${esc(b.isbn||'')}"><button class="btn" id="lookup">검색</button><button class="btn" id="scan">📷 스캔</button></div><label style="margin-top:9px;font-weight:400"><input type="checkbox" id="continuous"> 연속 등록 (저장 후 다음 책 스캔)</label><div class="muted" id="lookupMessage">검색 결과가 없어도 직접 등록할 수 있어요.</div></div><div class="two"><div class="formrow"><label>책 제목 *</label><input class="field" id="title" value="${esc(b.title||'')}"></div><div class="formrow"><label>저자</label><input class="field" id="author" value="${esc(b.author||'')}"></div><div class="formrow"><label>출판사</label><input class="field" id="publisher" value="${esc(b.publisher||'')}"></div><div class="formrow"><label>전체 페이지 수</label><input class="field" id="pages" type="number" min="0" value="${b.pages||''}"></div><div class="formrow"><label>책 구분</label><select class="field" id="type">${Object.entries(typeName).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="formrow"><label>독서 상태</label><select class="field" id="status">${Object.entries(statusName).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="formrow"><label>현재 읽은 페이지</label><input class="field" id="current" type="number" min="0" value="${b.current||0}"></div><div class="formrow"><label>반납 예정일 (빌린 책)</label><input class="field" id="due" type="date" value="${esc(b.due||'')}"></div><div class="formrow"><label>빌린 곳 / 빌려준 사람</label><input class="field" id="source" placeholder="도서관, 친구 이름 등" value="${esc(b.source||'')}"></div><div class="formrow"><label>책 표지 이미지 URL</label><input class="field" id="cover" type="url" value="${esc(b.cover||'')}"></div></div><div class="formrow"><label>메모 / 독후감</label><textarea class="field" id="notes">${esc(b.notes||'')}</textarea></div><div class="formrow"><label>별점</label><select class="field" id="rating">${[0,1,2,3,4,5].map(n=>`<option value="${n}">${n?n+'점':'미평가'}</option>`).join('')}</select></div><button class="btn primary" id="saveBook" style="width:100%">${b.id?'수정 저장':'내 서재에 등록'}</button>`}
function editBook(id){let b=typeof id==='string'?db.books.find(x=>x.id===id):null;b=b||{};modal(bookForm(b));$('type').value=b.type||'owned';$('status').value=b.status||'planned';$('rating').value=b.rating||0;$('saveBook').onclick=()=>{let title=$('title').value.trim();if(!title){alert('책 제목을 입력해 주세요.');return}let pages=Math.max(0,parseInt($('pages').value)||0),current=Math.max(0,parseInt($('current').value)||0);let data={id:b.id||uid(),title,author:$('author').value.trim(),publisher:$('publisher').value.trim(),isbn:$('isbn').value.trim(),type:$('type').value,status:$('status').value,pages,current:pages?Math.min(pages,current):current,due:$('due').value,source:$('source').value.trim(),cover:$('cover').value.trim(),notes:$('notes').value,rating:+$('rating').value,created:b.created||today()};if(data.status==='finished'&&pages)data.current=pages;if(b.id)db.books=db.books.map(x=>x.id===b.id?data:x);else db.books.unshift(data);save();let again=!!$('continuous')?.checked;closeModal();render();if(again){editBook();openScanner(code=>{$('isbn').value=code;lookupISBN()});$('continuous').checked=true}};$('lookup').onclick=lookupISBN;$('scan').onclick=()=>openScanner(isbn=>{$('isbn').value=isbn;lookupISBN()});}
async function lookupISBN(){let isbn=$('isbn').value.replace(/[^0-9Xx]/g,'');if(!/^(\d{13}|\d{9}[\dXx])$/.test(isbn)){$('lookupMessage').textContent='10자리 또는 13자리 ISBN을 입력해 주세요.';return}let msg=$('lookupMessage');msg.textContent='도서 정보를 찾는 중…';$('lookup').disabled=true;try{let info=await fetchMetadata(isbn);if(!info){msg.textContent='검색 결과가 없어요. 제목과 정보를 직접 입력해 주세요.';return}for(let k of ['title','author','publisher','pages','cover'])if(info[k]&&!$(k).value)$(k).value=info[k];msg.textContent='✅ 책 정보를 불러왔어요. 내용을 확인하고 등록해 주세요.'}catch(e){msg.textContent='검색에 실패했어요. 네트워크 연결을 확인하거나 직접 입력해 주세요.'}finally{$('lookup').disabled=false}}
async function fetchMetadata(isbn){let a=await Promise.allSettled([fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+encodeURIComponent(isbn)).then(x=>x.json()),fetch('https://openlibrary.org/isbn/'+encodeURIComponent(isbn)+'.json').then(async x=>x.ok?x.json():null)]);let g=a[0].status==='fulfilled'?a[0].value?.items?.[0]?.volumeInfo:null,o=a[1].status==='fulfilled'?a[1].value:null;if(!g&&!o)return null;let author=(g?.authors||[]).join(', '),publisher=g?.publisher||o?.publishers?.[0]||'',cover=g?.imageLinks?.thumbnail?.replace(/^http:/,'https:')|| (o?.covers?.[0]?`https://covers.openlibrary.org/b/id/${o.covers[0]}-M.jpg`:'');return {title:g?.title||o?.title||'',author,publisher,pages:g?.pageCount||o?.number_of_pages||'',cover}}
function detail(id){let b=db.books.find(x=>x.id===id);if(!b)return;let logs=db.logs.filter(l=>l.bookId===id).sort((a,z)=>z.date.localeCompare(a.date));modal(`<div class="modalhead"><h2>책 상세 정보</h2><button class="btn small" id="closeModal">닫기 ✕</button></div><div class="detailtop">${cover(b,'detailcover')}<div style="flex:1;min-width:0"><h2>${esc(b.title)}</h2><div class="muted">${esc(b.author||'저자 미상')}</div><div class="tags">${bookTag(b)}</div><div class="muted">${esc(b.publisher||'')} ${b.isbn?`· ISBN ${esc(b.isbn)}`:''}</div>${b.source?`<p class="muted">${b.type==='lent'?'빌려준 사람':'대여처'}: ${esc(b.source)}</p>`:''}${b.due?`<p class="muted">반납 예정일: ${esc(b.due)}</p>`:''}${b.rating?`<p>⭐ ${'★'.repeat(b.rating)}${'☆'.repeat(5-b.rating)}</p>`:''}</div></div><div class="section"><div class="flex between"><b>독서 진행률</b><b>${pct(b)}%</b></div><div class="progress" style="height:11px"><div style="width:${pct(b)}%"></div></div><div class="muted">${b.current||0} / ${b.pages||'?'} 쪽</div></div><div class="stickyactions"><button class="btn primary" id="logAdd">＋ 독서 기록</button><button class="btn" id="editThis">수정</button><button class="btn danger" id="deleteThis">삭제</button></div>${b.notes?`<div class="section"><h3>독후감 · 메모</h3><div style="white-space:pre-wrap">${esc(b.notes)}</div></div>`:''}<hr class="line"><h3>읽은 기록</h3>${logs.length?logs.map(l=>`<div class="record"><b>${esc(l.date)}</b> · ${+l.pages||0}쪽 · ${+l.minutes||0}분${l.note?`<div>${esc(l.note)}</div>`:''}<button class="btn small danger" data-delete-log="${esc(l.id)}">삭제</button></div>`).join(''):'<div class="muted">아직 기록이 없어요.</div>'}`);$('editThis').onclick=()=>editBook(id);$('logAdd').onclick=()=>logForm(id);$('deleteThis').onclick=()=>{if(confirm('이 책과 독서 기록을 모두 삭제할까요?')){db.books=db.books.filter(x=>x.id!==id);db.logs=db.logs.filter(x=>x.bookId!==id);save();closeModal();render()}};document.querySelectorAll('[data-delete-log]').forEach(e=>e.onclick=()=>{if(confirm('이 독서 기록을 삭제할까요?')){db.logs=db.logs.filter(x=>x.id! function logForm(id){let b=db.books.find(x=>x.id===id);modal(`<div class="modalhead"><div><h2>📖 독서 기록</h2><div class="muted">${esc(b.title)}</div></div><button class="btn small" id="closeModal">닫기 ✕</button></div><div class="formrow"><label>읽은 날짜</label><input class="field" id="logDate" type="date" value="${today()}"></div><div class="two"><div class="formrow"><label>오늘 읽은 페이지 수</label><input class="field" id="logPages" type="number" min="0" value="0"></div><div class="formrow"><label>독서 시간 (분)</label><input class="field" id="logMinutes" type="number" min="0" value="0"></div></div><div class="formrow"><label>짧은 메모</label><textarea class="field" id="logNote" placeholder="오늘 기억에 남는 내용"></textarea></div><button class="btn primary" id="saveLog" style="width:100%">기록 저장</button>`);$('saveLog').onclick=()=>{let date=$('logDate').value,pages=+$('logPages').value,minutes=+$('logMinutes').value;if(!date||!Number.isFinite(pages)||pages<0||!Number.isInteger(pages)||!Number.isFinite(minutes)||minutes<0){alert('날짜와 0 이상의 올바른 숫자를 입력해 주세요.');return}db.logs.push({id:uid(),bookId:id,date,pages,minutes,note:$('logNote').value});b.current=(b.current||0)+pages;if(b.pages&&b.current>=b.pages){b.current=b.pages;b.status='finished'}else if(pages>0&&b.status==='planned')b.status='reading';save();render();detail(id)}}

   const wishlist=get(row,'구매하고 싶은 책')==='예';
   const note=get(row,'메모');const tags=get(row,'사용 중인 태그들');
   const notes=[note&&note!=='24'?note:'',tags?`Bookmory 태그: ${tags}`:''].filter(Boolean).join('\n');
   records.push({id:crypto.randomUUID(),title,author:author==='24'?'':author,publisher:get(row,'출판사'),isbn,type:wishlist?'wishlist':'owned',status,pages:Number.isFinite(p)&&p>0?p:0,current:0,due:'',source:'',cover:'',notes,rating:0,created:today()});
   if(isbn)seenIsbn.add(isbn);seenTitle.add(key);
  }
  if(message)message.textContent='분석 완료';
  const preview=records.slice(0,7).map(b=>`<div class="record"><b>${esc(b.title)}</b><div class="muted">${esc(b.author)} · ${esc(b.isbn||'ISBN 없음')}</div></div>`).join('');
  modal(`<div class="modalhead"><div><h2>📚 Bookmory 가져오기 확인</h2><div class="muted">기존 책을 지우지 않고 추가합니다.</div></div><button class="btn small" id="closeModal">닫기 ✕</button></div><div class="panel" style="margin-bottom:12px"><b>추가 예정 ${records.length}권</b><div class="muted">중복 제외 ${duplicates}권 · 제목 없는 행 ${invalid}개</div><div class="muted">가져온 읽기 상태와 소장 구분은 등록 후 수정할 수 있어요.</div></div><div style="max-height:40vh;overflow:auto">${preview||'<p>추가할 새 책이 없습니다.</p>'}</div><p class="muted">기존 독서 기록은 유지됩니다. 이 파일에는 독서 일지의 상세 시간이 없는 경우 해당 기록은 생성하지 않습니다.</p><button id="confirmBookmory" class="btn primary" style="width:100%" ${!records.length?'disabled':''}>${records.length}권 가져오기</button>`);
  $('confirmBookmory').onclick=async()=>{
   const btn=$('confirmBookmory');btn.disabled=true;btn.textContent='클라우드에 저장하는 중…';
   try{
    // Avoid optimistic local changes until all database rows have been committed.
    const {error}=await cloudClient.from('books').insert(records.map(toBook));
    if(error)throw error;
    await enterCloud();render();alert(`${records.length}권을 가져왔어요! PC와 갤럭시에서 확인해 보세요.`)
   }catch(error){btn.disabled=false;btn.textContent='다시 시도';alert('가져오기 실패: '+error.message+'\n책 목록이 추가되었는지 확인하고 재시도해 주세요.')}
  }
 }catch(error){if(message)message.textContent='가져오기 실패: '+error.message;alert(error.message)}
}

startCloud();
</script></body></html>
