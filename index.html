<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>나의 독서 서재</title>
<style>
:root{--bg:#f8f7f3;--card:#fff;--ink:#25332e;--sub:#75817b;--accent:#397c64;--light:#e8f4ec;--line:#e5e8e2;--warn:#b96c34;--red:#b74d55}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:1100px;padding:20px 17px 90px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:5px 0 23px}h1{margin:0;font-size:27px}h2{font-size:20px;margin:0 0 13px}h3{margin:0 0 8px;font-size:16px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);font-weight:800}.muted{color:var(--sub);font-size:13px}.btn{border:1px solid var(--line);padding:10px 14px;border-radius:11px;background:white;color:var(--ink);font-weight:650}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px}.stat .n{font-size:28px;font-weight:850;margin:8px 0 2px}.stat .label{font-size:12px;color:var(--sub)}.tabs{display:flex;gap:7px;overflow-x:auto;margin:18px 0;scrollbar-width:none}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:100px}.tab.on{background:var(--ink);color:#fff}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:15px}.toolbar input{flex:1;min-width:180px}.field{width:100%;padding:11px 12px;background:white;color:var(--ink);border:1px solid #d9dfd8;border-radius:10px;outline-color:var(--accent)}label{font-size:13px;font-weight:650;display:block;margin-bottom:5px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}.book{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;min-width:0}.book:hover{border-color:#8ab7a3}.title-results{display:grid;gap:7px;margin-top:9px;max-height:320px;overflow-y:auto}.title-result{display:flex;align-items:center;gap:11px;text-align:left;width:100%;padding:9px;background:#fafbf9;border:1px solid var(--line);border-radius:10px}.title-result:hover{border-color:var(--accent)}.title-result img,.result-placeholder{width:42px;height:60px;object-fit:contain;flex-shrink:0}.result-placeholder{display:grid;place-items:center;background:var(--light)}.result-body{flex:1;min-width:0;display:grid;gap:4px}.result-body strong{font-size:13px}.result-body small{font-size:11px;color:var(--sub)}.cover{height:190px;object-fit:contain;width:100%;border-radius:8px;background:#eff0e8}.placeholder{display:flex;align-items:center;justify-content:center;background:#e5eee6;color:#5b8270;font-size:41px}.booktitle{font-weight:750;font-size:14px;margin:9px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.tag{background:#f1f2f0;padding:4px 6px;border-radius:6px;font-size:10px;color:#526359}.tag.green{background:var(--light);color:var(--accent)}.tag.orange{background:#fff0dc;color:#986023}.progress{height:7px;border-radius:10px;background:#e8eae6;overflow:hidden;margin:8px 0}.progress>div{height:100%;background:var(--accent)}.flex{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.hidden{display:none!important}.empty{text-align:center;color:var(--sub);padding:45px 10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.section{margin-top:18px}.detailtop{display:flex;gap:18px}.detailcover{height:190px;width:125px;object-fit:contain;background:#eef0e9;border-radius:8px}.line{border:0;border-top:1px solid var(--line);margin:18px 0}.modalback{position:fixed;inset:0;background:#13241c9c;display:flex;justify-content:center;align-items:center;padding:15px;z-index:10}.modal{background:#fff;border-radius:19px;width:min(100%,650px);max-height:92vh;overflow:auto;padding:21px}.modalhead{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:15px}.formrow{margin-bottom:13px}.formrow .muted{margin:5px 0}.alert{background:#fff3e6;color:#98571d;padding:10px;border-radius:10px;font-size:13px}.success{background:var(--light);color:var(--accent);padding:10px;border-radius:10px;font-size:13px}.record{border-top:1px solid var(--line);padding:10px 0;font-size:13px}.chart{display:flex;align-items:end;gap:7px;height:145px;border-bottom:1px solid var(--line);padding-bottom:18px;margin-top:14px}.barcol{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;position:relative}.bar{background:#6eae91;min-height:2px;width:60%;border-radius:5px 5px 0 0}.barlabel{position:absolute;top:100%;font-size:10px;color:var(--sub);padding-top:5px}.barvalue{font-size:10px;color:var(--sub);margin-bottom:3px}video{width:100%;max-height:280px;background:#1e2724;border-radius:12px}.stickyactions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}textarea{min-height:85px;resize:vertical}.footer{font-size:12px;color:var(--sub);text-align:center;margin-top:25px}@media(max-width:610px){.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:13px}.stat .n{font-size:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cover{height:156px}.two{grid-template-columns:1fr}.modal{padding:16px}.detailcover{height:150px;width:95px}header h1{font-size:23px}.wrap{padding-top:15px}}

/* Warm mobile-first book registration inspired by user's reference */
.modalback:has(.registration-form),.modalback:has(.registration-choices){background:#24201bbb;align-items:center}
.modal:has(.registration-form){background:#f7efe4;color:#46423e;border-radius:24px;padding:0;width:min(100%,650px);max-height:95dvh}
.registration-form{padding:20px clamp(18px,5vw,35px) 28px}
.registration-form .modalhead{align-items:center;margin-bottom:26px}
.registration-form .modalhead h2{font-size:27px;color:#494440}
.registration-form .field{background:#f1ede8;border:0;border-radius:8px;padding:13px 12px;min-width:0}
.registration-form .formrow{margin-bottom:17px}
.registration-form label{color:#625d58;font-size:14px}
.registration-form .two{grid-template-columns:1fr;gap:0;background:#fffaf4;border-radius:19px;padding:19px 15px;margin:15px 0}
.registration-form .two .formrow:last-child{margin-bottom:0}
.registration-form .btn:not(.primary){background:#fffaf5;border:1px solid #e4dbd0;color:#4b6d83}
.registration-form .btn.primary{background:#4e7e98;border-color:#4e7e98}
.registration-form .flex{flex-wrap:wrap}
.registration-form .flex input{flex:1;min-width:140px}
.registration-cover{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;margin:5px auto 24px}
.registration-cover img,.registration-cover .registration-cover-placeholder{height:190px;width:140px;object-fit:contain;border-radius:12px;box-shadow:0 6px 19px #00000018;background:#e9dfd3}
.registration-cover-placeholder{display:grid;place-items:center;font-size:54px}
.registration-cover small{color:#8a837b}
.registration-section-title{font-size:15px;font-weight:750;margin:22px 0 10px;color:#69615b}
.registration-form .modalhead .btn{border-radius:30px}
.registration-choices{padding:12px 3px 4px}
.modal:has(.registration-choices){background:#fbf7f2;max-width:490px;border-radius:25px;padding:22px}
.registration-choices h2{text-align:center;color:#514b46;margin:2px 0 22px}
.registration-choice{display:flex;align-items:center;gap:16px;width:100%;background:transparent;border:0;border-top:1px solid #dedbd4;padding:21px 15px;text-align:left;font-size:17px;color:#56524e}
.registration-choice strong{display:block;font-size:17px}
.registration-choice small{display:block;color:#827c76;margin-top:6px;font-size:12px}
.registration-choice .regicon{font-size:26px;width:36px;text-align:center}
@media(max-width:610px){.modalback:has(.registration-choices){align-items:flex-end;padding:0}.modal:has(.registration-choices){border-radius:28px 28px 0 0;width:100%;max-width:none;padding:19px 19px max(18px,env(safe-area-inset-bottom))}.modalback:has(.registration-form){padding:0}.modal:has(.registration-form){width:100%;max-height:100dvh;height:100dvh;border-radius:0}.registration-form{padding:25px 20px 45px}}

/* 다중 선택 */
.book{position:relative}.book.selected-book{border:2px solid var(--accent);background:#f3faf5}
.book-select{position:absolute;top:8px;left:8px;z-index:1;display:flex;align-items:center;gap:3px;background:#fffdf2f0;border:1px solid #cbd8ca;border-radius:8px;padding:6px;cursor:pointer}
.book-select input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.bulkbar{background:#eff8f1;border:1px solid #c6dcca;border-radius:14px;padding:12px;margin:10px 0 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bulkbar select{width:auto;max-width:100%}.bulkbar .btn{white-space:nowrap}
.bulk-note{font-size:12px;color:var(--sub);width:100%}

/* 갤럭시 등 좁은 화면: 메인 책장 검색 도구만 반응형 배치 */
@media (max-width:610px) {
  #main { min-width:0; max-width:100%; }
  #main .toolbar {
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:9px;
    width:100%;
    min-width:0;
  }
  #main .toolbar > #bookSearch,
  #main .toolbar > #statusFilter {
    grid-column:1 / -1;
    display:block;
    width:100% !important;
    min-width:0;
    max-width:100%;
    flex:none;
    font-size:16px;
  }
  #main .toolbar > #addMain,
  #main .toolbar > #toggleMulti,
  #main .toolbar > #randomUnread {
    min-width:0;
    width:100%;
    padding:11px 5px;
    font-size:13px;
    line-height:1.35;
    white-space:normal;
    overflow-wrap:anywhere;
  }
}

@media (max-width:610px) {
  #main .toolbar > #randomUnread {grid-column:1 / -1;}
}

/* 등록 후 30일 동안 책장 카드에 NEW 표시 */
.book-new-badge{position:absolute;right:9px;top:9px;z-index:2;background:#de6654;color:#fff;border-radius:7px;padding:4px 7px;font-size:11px;font-weight:800;letter-spacing:.04em;box-shadow:0 2px 7px #0002;pointer-events:none}

/* 모바일 상단 헤더: 제목과 액션을 각각 한 줄 그룹으로 분리 */
@media (max-width: 610px) {
  header { display:flex; flex-direction:column; align-items:stretch; gap:13px; margin-bottom:20px; }
  header > div:first-child { min-width:0; }
  header h1 { font-size:clamp(21px,6vw,26px); line-height:1.3; white-space:nowrap; }
  header .eyebrow { font-size:10px; }
  header > .flex { display:flex; width:100%; gap:8px; flex-wrap:nowrap; align-items:center; }
  header #syncBadge { flex:1 1 auto; min-width:0; font-size:12px; white-space:nowrap; }
  header #logoutButton { flex:0 0 auto; white-space:nowrap; padding:9px 10px; font-size:12px; }
  header #addTop { flex:0 0 auto; white-space:nowrap; padding:10px 12px; font-size:13px; }
}
@media (max-width: 360px) {
  header #syncBadge {font-size:11px;}
  header #logoutButton {padding:8px 7px;}
  header #addTop {padding:9px 8px;font-size:12px;}
}

/* 휴대폰 검색 UX: 한글 조합 시 검색창 자체는 재생성하지 않음 */
#main #bookSearch{font-size:18px;min-height:60px;line-height:1.5;padding:15px 18px;border:2px solid #397c64;border-radius:15px;outline-offset:2px;}
#main #bookSearch:focus{box-shadow:0 0 0 3px rgba(57,124,100,.12);}
@media(max-width:610px){#main .toolbar{gap:12px}#main #bookSearch{font-size:18px;min-height:66px;padding:17px 16px;width:100%;}#main .toolbar > #addMain,#main .toolbar > #toggleMulti{min-height:48px}}
/* 홈 화면 · 대형 한글 검색 */
.home-welcome{display:flex;justify-content:space-between;align-items:center;margin:10px 0 16px}.home-reading{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:12px}.home-book{display:flex;align-items:start;gap:15px;padding:16px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;color:var(--ink)}.home-cover{width:88px;height:126px;object-fit:contain;border-radius:9px;flex:none}.home-description{display:flex;flex-direction:column;gap:9px;min-width:0;flex:1}.home-description strong{font-size:16px}.home-description small{color:var(--sub)}.home-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.home-actions .btn{min-height:54px}#main #bookSearch{min-height:70px;font-size:20px} @media(max-width:610px){.home-actions{grid-template-columns:1fr}#main #bookSearch{min-height:72px;font-size:20px}} 
</style></head><body><div class="wrap">
<header><div><div class="eyebrow">MY BOOK LIBRARY</div><h1>📚 나의 독서 서재</h1><div class="muted">나만의 책장과 독서 기록</div></div><div class="flex"><span id="syncBadge" class="muted">연결 대기</span><button class="btn small hidden" id="logoutButton">로그아웃</button><button class="btn primary" id="addTop">＋ 책 등록</button></div></header>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"><button class="tab on" data-tab="home">🏠 홈</button><button class="tab" data-tab="all">전체 책장</button><button class="tab" data-tab="owned">내 소장</button><button class="tab" data-tab="borrowed">빌린 책</button><button class="tab" data-tab="lent">빌려준 책</button><button class="tab" data-tab="wishlist">위시리스트</button><button class="tab" data-tab="report">독서 통계</button><button class="tab" data-tab="settings">설정·백업</button></div>
<main id="main"></main><div class="footer" id="cloudFooter">🔒 로그인 후 PC와 갤럭시에서 같은 기록을 사용합니다.</div></div>
<div id="overlay" class="hidden"></div><script>
'use strict';const STORE='reading-library-v1';let db=load(),tab='home',search='',filter='all',multiMode=false,selectedBookIds=new Set(),bulkRunning=false,scanStream=null,scanTimer=null,zxingReader=null,continuous=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('en-CA');const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();function load(){try{let v=JSON.parse(localStorage.getItem(STORE));if(v&&Array.isArray(v.books)&&Array.isArray(v.logs))return v}catch{}return {books:[],logs:[],loans:[],goal:12}}function save(){if(!cloudUser)throw Error("로그인이 필요해요.");queueSync(JSON.parse(JSON.stringify(db)))}const statusName={planned:'읽기 전',reading:'읽는 중',finished:'완독'};const typeName={owned:'내 소장',borrowed:'빌린 책',lent:'빌려준 책',wishlist:'위시리스트'};const activeLoan=b=>db.loans?.find(l=>l.bookId===b.id&&!l.returnedAt);const returnedBorrowed=b=>b.type==='borrowed'&&!activeLoan(b)&&db.loans?.some(l=>l.bookId===b.id&&l.returnedAt);const pct=b=>b.pages>0?Math.min(100,Math.round((b.current||0)/b.pages*100)):(b.status==='finished'?100:0);function bookTag(b){return `<span class="tag ${b.type==='owned'?'green':b.type==='borrowed'?'orange':''}">${typeName[b.type]||'기타'}</span><span class="tag">${statusName[b.status]||'읽기 전'}</span>`}function cover(b,cl='cover'){return b.cover?`<img class="${cl}" loading="lazy" referrerpolicy="no-referrer" src="${esc(b.cover)}" alt="${esc(b.title)} 표지" onerror="this.outerHTML='<div class=&quot;${cl} placeholder&quot;>📖</div>'">`:`<div class="${cl} placeholder">📖</div>`}
function isNewBook(b){
  if(!b.created || !/^\d{4}-\d{2}-\d{2}$/.test(b.created))return false;
  const [year,month,day]=b.created.split('-').map(Number);
  const created=new Date(year,month-1,day);
  if(created.getFullYear()!==year||created.getMonth()!==month-1||created.getDate()!==day)return false;
  const todayLocal=new Date();todayLocal.setHours(0,0,0,0);
  const days=Math.round((Date.UTC(todayLocal.getFullYear(),todayLocal.getMonth(),todayLocal.getDate())-Date.UTC(year,month-1,day))/86400000);
  return days>=0 && days<30;
}
function render(){let now=new Date(),ym=now.toISOString().slice(0,7),finished=db.books.filter(b=>b.status==='finished').length,month=db.logs.filter(l=>l.date.startsWith(ym)),monthPages=month.reduce((n,l)=>n+(+l.pages||0),0);$('stats').innerHTML=[['소장한 책',db.books.filter(b=>b.type==='owned'||b.type==='lent').length+'권'],['빌린 책',db.books.filter(b=>b.type==='borrowed').length+'권'],['완독한 책',finished+'권'],['이번 달 독서',monthPages+'쪽']].map(([l,n])=>`<div class="stat"><div class="label">${l}</div><div class="n">${n}</div></div>`).join('');document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.dataset.tab===tab));if(tab==='home'){homeView();return}if(tab==='report'){multiMode=false;selectedBookIds.clear();report();return}if(tab==='settings'){multiMode=false;selectedBookIds.clear();settings();return}let list=db.books.filter(b=>(tab==='all'||b.type===tab)&&(filter==='all'||b.status===filter)&&[b.title,b.author,b.isbn,b.publisher,b.barcode].join(' ').toLowerCase().includes(search.toLowerCase()));$('main').innerHTML=`<div class="toolbar"><input class="field" id="bookSearch" placeholder="제목·저자·ISBN·바코드 검색" value="${esc(search)}"><select class="field" id="statusFilter" style="width:auto"><option value="all">독서 상태 전체</option><option value="planned">읽기 전</option><option value="reading">읽는 중</option><option value="finished">완독</option></select><button class="btn" id="addMain">＋ 책 추가</button><button class="btn" id="toggleMulti" type="button">${multiMode?'선택 종료':'☑ 여러 책 선택'}</button><button class="btn" id="randomUnread" type="button">🎲 안 읽은 책 추천</button></div>${multiMode?bulkToolbar(list):''}<div id="bookSearchResults">${bookSearchResultsHTML(list)}</div>`;const searchBox=$('bookSearch');
searchBox.addEventListener('input',e=>{search=e.target.value;if(!e.isComposing&&searchBox.dataset.composing!=='true')refreshBookSearchResults();});
searchBox.addEventListener('compositionstart',()=>{searchBox.dataset.composing='true'});
searchBox.addEventListener('compositionend',e=>{searchBox.dataset.composing='false';search=e.target.value;setTimeout(()=>{if(document.getElementById('bookSearch')===searchBox)refreshBookSearchResults()},0);});
searchBox.addEventListener('blur',()=>{if(searchBox.dataset.composing!=='true')refreshBookSearchResults()});$('statusFilter').value=filter;$('statusFilter').onchange=e=>{filter=e.target.value;render()};$('addMain').onclick=chooseBookMethod;$('randomUnread').onclick=showUnreadRandom;setupBulkActions(list);bindBookCards()}
function homeView(){
 const reading=db.books.filter(b=>b.status==='reading'&&!returnedBorrowed(b));
 $('main').innerHTML=`<div class="home-welcome"><h2>📖 지금 읽는 책</h2><span class="muted">${reading.length}권 읽는 중</span></div>${reading.length?`<div class="home-reading">${reading.map(b=>`<button class="home-book" data-homebook="${esc(b.id)}">${cover(b,'home-cover')}<span class="home-description"><strong>${esc(b.title)}</strong><small>${esc(b.author||'저자 미상')}</small><span>${b.current||0} / ${b.pages||'?'}쪽 · ${pct(b)}%</span><span class="progress"><span style="display:block;background:var(--accent);height:100%;width:${pct(b)}%"></span></span><small>자세히 보기 · 독서 기록하기 →</small></span></button>`).join('')}</div>`:`<div class="panel" style="margin-bottom:16px"><p>현재 읽는 책이 없어요. 전체 책장에서 독서 상태를 ‘읽는 중’으로 변경해 보세요.</p></div>`}<div class="home-actions"><button class="btn primary" id="openShelf">📚 전체 책장 · ${db.books.length}권</button><button class="btn" id="homeRandom">🎲 안 읽은 책 추천</button></div>`;

async function fetchBookJSON(url){
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),9500);
 try{const res=await fetch(url,{signal:controller.signal,headers:{Accept:'application/json'}});
  if(!res.ok)throw Error('HTTP '+res.status);
  return await res.json();
 }finally{clearTimeout(timer)}
}
async function fetchKakaoBooks(query,type){
 if(!cloudClient||!cloudUser)throw Error('카카오 도서 검색은 Supabase 로그인이 필요해요.');
 const {data:sessionData,error:sessionError}=await cloudClient.auth.getSession();
 if(sessionError||!sessionData?.session?.access_token)throw Error('로그인 세션이 만료됐어요. 다시 로그인해 주세요.');
 const {data,error}=await cloudClient.functions.invoke('kakao-book-search',{body:{query,type}});
 if(error){
  let details='';
  try{if(error.context&&typeof error.context.json==='function'){const body=await error.context.json();details=body.error||body.message||'';}}catch{}
  throw Error(details||error.message||'카카오 검색 함수 호출에 실패했어요.');
 }
 if(data?.error)throw Error(data.error);
 return (data?.books||[]).map(b=>{
  const codes=String(b.isbn||'').split(/\s+/).filter(Boolean);
  const isbn=codes.find(x=>/^97[89]\d{10}$/.test(x))||codes[0]||'';
  return {title:b.title||'',author:(b.authors||[]).join(', '),publisher:b.publisher||'',pages:'',cover:String(b.thumbnail||'').replace(/^http:/,'https:'),isbn,source:'카카오 책 검색'};
 }).filter(b=>b.title);
}
async function fetchMetadata(isbn){
 const code=String(isbn).toUpperCase();const errors=[];
 try{
  const books=await fetchKakaoBooks(code,'isbn');
  const match=books.find(x=>String(x.isbn).replace(/[^0-9X]/gi,'')===code)||books[0];
  if(match)return match;
 }catch(e){errors.push('카카오: '+e.message)}
 // Google Books: ISBN query (search result may omit cover).
 try{
  const data=await fetchBookJSON('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent('isbn:'+code)+'&maxResults=10');
  const items=data.items||[];
  const match=items.find(item=>(item.volumeInfo?.industryIdentifiers||[]).some(x=>String(x.identifier||'').replace(/[^0-9X]/gi,'').toUpperCase()===code))||items[0];
  const g=match?.volumeInfo;
  if(g?.title){return {title:g.title,author:(g.authors||[]).join(', '),publisher:g.publisher||'',pages:g.pageCount||'',cover:(g.imageLinks?.thumbnail||g.imageLinks?.smallThumbnail||'').replace(/^http:/,'https:'),source:'Google Books'}};
 }catch(e){errors.push('Google Books: '+e.message)}
 // Open Library ISBN endpoint. Some records have no authors, so look them up separately.
 try{
  const o=await fetchBookJSON('https://openlibrary.org/isbn/'+encodeURIComponent(code)+'.json');
  if(o?.title){let author='';
   if(o.authors?.length){const names=await Promise.all(o.authors.slice(0,3).map(async x=>{try{const a=await fetchBookJSON('https://openlibrary.org'+x.key+'.json');return a.name||''}catch{return ''}}));author=names.filter(Boolean).join(', ')}
   return {title:o.title,author,publisher:o.publishers?.[0]||'',pages:o.number_of_pages||'',cover:o.covers?.[0]?`https://covers.openlibrary.org/b/id/${o.covers[0]}-M.jpg`:'',source:'Open Library'};
  }
 }catch(e){errors.push('Open Library ISBN: '+e.message)}
 // Fallback to indexed ISBN search if the direct endpoint has no edition.
 try{
  const o=await fetchBookJSON('https://openlibrary.org/search.json?isbn='+encodeURIComponent(code)+'&limit=5&fields=title,author_name,publisher,number_of_pages_median,cover_i,isbn');
  const match=(o.docs||[]).find(d=>(d.isbn||[]).includes(code))||o.docs?.[0];
  if(match?.title)return {title:match.title,author:(match.author_name||[]).slice(0,3).join(', '),publisher:match.publisher?.[0]||'',pages:match.number_of_pages_median||'',cover:match.cover_i?`https://covers.openlibrary.org/b/id/${match.cover_i}-M.jpg`:'',source:'Open Library 검색'};
 }catch(e){errors.push('Open Library 검색: '+e.message)}
 if(errors.length===3)throw Error(errors.join(' / '));
 return null;
}
function setBookFieldsFromSearch(info){

  if(info[k] && $(k))$(k).value=String(info[k]);
 }

}

    found.push(...(data.docs||[]).map(g=>({title:g.title||'',author:(g.author_name||[]).slice(0,3).join(', '),publisher:g.publisher?.[0]||'',pages:g.number_of_pages_median||'',cover:g.cover_i?'https://covers.openlibrary.org/b/id/'+encodeURIComponent(g.cover_i)+'-M.jpg':'',isbn:(g.isbn||[]).find(x=>/^97[89]\d{10}$/.test(x))||(g.isbn||[])[0]||'',source:'Open Library'})).filter(x=>x.title));

 }catch(e){status.textContent='검색 오류: '+e.message}
 finally{btn.disabled=false}

 if(/^97[89]\d{10}$/.test(code)){$('isbn').value=code;lookupISBN();return}

function stopScan(){if(scanTimer){clearTimeout(scanTimer);scanTimer=null}if(zxingReader){try{zxingReader.reset()}catch{}zxingReader=null}if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}async function openScanner(onCode){
 if(!window.isSecureContext){alert('카메라를 사용하려면 HTTPS 주소 또는 localhost가 필요해요. ISBN을 직접 입력해도 됩니다.');return}
 const parent=$('overlay').querySelector('.modal');
 const original=Array.from(parent.childNodes);
 original.forEach(node=>{if(node.nodeType===1)node.style.display='none'});
 const scanner=document.createElement('div');scanner.innerHTML=`<div class="modalhead"><h2>📷 책 바코드 스캔</h2><button class="btn small" id="cancelScan">돌아가기 ✕</button></div><video id="camera" autoplay playsinline muted></video><p class="muted" id="scanMsg">책의 ISBN·일반 상품·도서관 바코드를 카메라 가운데에 놓아주세요.</p>`;parent.appendChild(scanner);
 let active=true;
 const back=()=>{if(!active)return;active=false;stopScan();scanner.remove();original.forEach(node=>{if(node.nodeType===1)node.style.display=''})};
 $('cancelScan').onclick=back;
 try{
   scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
   if(!active){stopScan();return}
   const video=$('camera');video.srcObject=scanStream;await video.play();
   const accept=value=>{const code=String(value||'').trim();if(active&&code.length>=4&&code.length<=64){back();onCode(code)}};
   if('BarcodeDetector' in window){
     const supported=await BarcodeDetector.getSupportedFormats();
     const formats=['ean_13','ean_8','upc_a','upc_e','code_128','code_39','codabar','itf'].filter(f=>supported.includes(f));
     if(!formats.length)throw Error('지원되지 않는 바코드 형식');
     const detector=new BarcodeDetector({formats});
     const loop=async()=>{if(!active)return;try{(await detector.detect(video)).forEach(v=>accept(v.rawValue))}catch{}if(active)scanTimer=setTimeout(loop,250)};loop();
   }else{
     let script=document.getElementById('zxingLib');
     if(!script){script=document.createElement('script');script.id='zxingLib';script.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';document.head.appendChild(script);await new Promise((res,rej)=>{script.onload=res;script.onerror=rej})}
     if(!window.ZXing)throw Error('스캐너 라이브러리를 불러오지 못했습니다');
     zxingReader=new ZXing.BrowserMultiFormatReader();
     zxingReader.decodeFromVideoElementContinuously(video,result=>{if(result)accept(result.getText())});
   }
 }catch(err){if(active)$('scanMsg').textContent='카메라 스캔을 사용할 수 없어요. 권한 또는 HTTPS 연결을 확인하고 바코드 번호를 직접 입력해 주세요.';stopScan()}
}

function excelStatus(v){const t=String(v||'').trim().toLowerCase();return ({'읽기 전':'planned','읽을 예정':'planned','planned':'planned','읽는 중':'reading','reading':'reading','완독':'finished','읽음':'finished','finished':'finished'})[t]||'planned'}
function excelKey(b){const isbn=String(b.isbn||'').replace(/[^0-9Xx]/g,'').toUpperCase();if(isbn)return 'i:'+isbn;if(b.barcode)return 'b:'+String(b.barcode).trim();return 't:'+String(b.title||'').trim().toLowerCase().replace(/\s+/g,'')+'|'+String(b.author||'').trim().toLowerCase().replace(/\s+/g,'')}

const setSync=(t,bad=false)=>{if(syncEl()){syncEl().textContent=t;syncEl().style.color=bad?'#b74d55':'#397c64'}};
function gate(html){document.getElementById('cloudGate')?.remove();const el=document.createElement('div');el.id='cloudGate';el.style='position:fixed;inset:0;z-index:100;background:#f8f7f3;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto';el.innerHTML='<div class="panel" style="width:min(100%,480px);box-shadow:0 12px 48px #14382219"><div class="eyebrow">MY BOOK LIBRARY · PRIVATE</div><h1 style="font-size:24px;margin:10px 0">🔒 나의 독서 서재</h1>'+html+'</div>';document.body.append(el);return el}
async function libraryClient(){if(window.supabase?.createClient)return window.supabase;if(!document.getElementById('supabaseLoader')){let el=document.createElement('script');el.id='supabaseLoader';el.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';document.head.append(el)}let i=0;while(!window.supabase?.createClient&&i++<120)await sleep(100);if(!window.supabase?.createClient)throw Error('Supabase 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');return window.supabase}
function configScreen(error=''){const el=gate('<p class="muted">처음 한 번만 Supabase의 <b>Project URL</b>과 <b>Publishable key</b>를 입력하면 돼요. 두 값은 이 브라우저에만 보관합니다.</p><div class="formrow"><label>Project URL</label><input class="field" id="cloudUrl" placeholder="https://xxxxx.supabase.co" autocomplete="off"></div><div class="formrow"><label>Publishable key (또는 legacy anon key)</label><input class="field" id="cloudKey" placeholder="sb_publishable_..." autocomplete="off"></div><p class="alert">데이터베이스 비밀번호, secret key, service_role key는 절대 입력하지 마세요.</p><p id="cloudErr" style="color:#b74d55;font-size:13px">'+esc(error)+'</p><button id="connectCloud" class="btn primary" style="width:100%">연결하기</button>');el.querySelector('#connectCloud').onclick=async()=>{let url=el.querySelector('#cloudUrl').value.trim().replace(/\/$/,'');let key=el.querySelector('#cloudKey').value.trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)||!key||/service_role|sb_secret_/.test(key)){el.querySelector('#cloudErr').textContent='Supabase URL과 공개용 키만 입력해 주세요.';return}localStorage.setItem(CLOUD_CONF,JSON.stringify({url,key}));await startCloud()}}
async function startCloud(){const conf=JSON.parse(localStorage.getItem(CLOUD_CONF)||'null');if(!conf){configScreen();return}gate('<p class="muted">Supabase에 연결하는 중…</p>');try{const lib=await libraryClient();cloudClient=lib.createClient(conf.url,conf.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data,error}=await cloudClient.auth.getUser();if(!error&&data?.user){cloudUser=data.user;await enterCloud()}else{cloudUser=null;loginScreen()}}catch(err){cloudUser=null;configScreen('연결 실패: '+err.message)}}
function loginScreen(error=''){const el=gate('<p class="muted">Supabase Authentication → Users에서 만든 계정으로 로그인하세요. 이 화면에서는 신규 회원가입을 할 수 없어요.</p><form id="loginForm"><div class="formrow"><label>이메일</label><input class="field" id="cloudEmail" type="email" autocomplete="username" required></div><div class="formrow"><label>비밀번호</label><input class="field" id="cloudPass" type="password" autocomplete="current-password" required></div><p id="cloudErr" style="color:#b74d55;font-size:13px">'+esc(error)+'</p><button class="btn primary" style="width:100%" type="submit">로그인</button></form><button class="btn small" style="margin-top:13px" id="changeCloud">연결 설정 변경</button>');el.querySelector('#changeCloud').onclick=()=>configScreen();el.querySelector('#loginForm').onsubmit=async e=>{e.preventDefault();let btn=el.querySelector('button[type="submit"]');btn.disabled=true;const {data,error}=await cloudClient.auth.signInWithPassword({email:el.querySelector('#cloudEmail').value,password:el.querySelector('#cloudPass').value});btn.disabled=false;if(error){el.querySelector('#cloudErr').textContent='로그인 실패: '+error.message;return}cloudUser=data.user;try{await enterCloud()}catch(err){loginScreen('독서 기록을 불러오지 못했어요: '+err.message)}}}
function fromBook(r){return{id:r.id,title:r.title,author:r.author||'',publisher:r.publisher||'',isbn:r.isbn||'',barcode:r.barcode||'',type:r.ownership,status:r.reading_status,pages:r.page_count||0,current:r.current_page||0,due:r.due_date||'',source:r.ownership==='lent'?(r.lent_to||''):(r.borrowed_from||''),cover:r.cover_url||'',notes:r.review||r.notes||'',rating:r.rating||0,created:(r.created_at||'').slice(0,10)}}
function fromLog(r){return{id:r.id,bookId:r.book_id,date:r.read_on,pages:r.pages_read,minutes:r.minutes_read,note:r.note||''}}
function toBook(b){return{id:b.id,user_id:cloudUser.id,isbn:b.isbn||null,barcode:b.barcode||null,title:b.title,author:b.author||null,publisher:b.publisher||null,cover_url:b.cover||null,page_count:b.pages||null,current_page:b.current||0,ownership:b.type,reading_status:b.status,borrowed_from:b.type==='borrowed'?(b.source||null):null,lent_to:b.type==='lent'?(b.source||null):null,due_date:b.due||null,rating:b.rating||null,review:b.notes||null}}
function toLoan(l){return{id:l.id,user_id:cloudUser.id,book_id:l.bookId,borrowed_at:l.borrowedAt,place:l.place||null,returned_at:l.returnedAt||null,page_at_return:l.pageAtReturn??null}}
function toLog(l){return{id:l.id,user_id:cloudUser.id,book_id:l.bookId,read_on:l.date,minutes_read:l.minutes||0,pages_read:l.pages||0,note:l.note||null}}
async function fetchAll(table){let all=[],from=0;while(true){let{data,error}=await cloudClient.from(table).select('*').range(from,from+999);if(error)throw error;all.push(...data);if(data.length<1000)break;from+=1000}return all}
async function enterCloud(){setSync('불러오는 중…');const [books,logs,loans]=await Promise.all([fetchAll('books'),fetchAll('reading_sessions'),fetchAll('book_loans')]);const {data:userInfo}=await cloudClient.auth.getUser();db={books:books.map(fromBook),logs:logs.map(fromLog),loans:loans.map(r=>({id:r.id,bookId:r.book_id,borrowedAt:r.borrowed_at,place:r.place||'',returnedAt:r.returned_at||null,pageAtReturn:r.page_at_return})),goal:Math.max(1,Number(userInfo?.user?.user_metadata?.reading_goal)||12)};serverShadow=clone(db);document.getElementById('cloudGate')?.remove();$('logoutButton').classList.remove('hidden');$('logoutButton').onclick=logoutCloud;setSync('✓ 동기화됨');render()}
async function logoutCloud(){try{await pendingSync}catch{}const {error}=await cloudClient.auth.signOut();if(error){alert(error.message);return}cloudUser=null;cloudClient=null;db={books:[],logs:[],loans:[],goal:12};$('main').innerHTML='';$('stats').innerHTML='';$('logoutButton').classList.add('hidden');setSync('로그아웃됨');loginScreen()}
function changed(a,b){return JSON.stringify(a)!==JSON.stringify(b)}
async function syncSnapshot(snapshot){if(!cloudUser)throw Error('로그인이 필요합니다');let old=serverShadow;const oldBooks=new Map(old.books.map(x=>[x.id,x])),oldLogs=new Map(old.logs.map(x=>[x.id,x]));const nextBooks=new Set(snapshot.books.map(x=>x.id)),nextLogs=new Set(snapshot.logs.map(x=>x.id)),oldLoans=new Map((old.loans||[]).map(x=>[x.id,x])),nextLoans=new Set((snapshot.loans||[]).map(x=>x.id));let booksUp=snapshot.books.filter(b=>!oldBooks.has(b.id)||changed(toBook(b),toBook(oldBooks.get(b.id))));let logsUp=snapshot.logs.filter(l=>!oldLogs.has(l.id)||changed(toLog(l),toLog(oldLogs.get(l.id))));let loansUp=(snapshot.loans||[]).filter(l=>!oldLoans.has(l.id)||changed(toLoan(l),toLoan(oldLoans.get(l.id))));async function batch(table,arr){if(!arr.length)return;const {error}=await cloudClient.from(table).upsert(arr,{onConflict:'id'});if(error)throw error}async function del(table,ids){if(!ids.length)return;const {error}=await cloudClient.from(table).delete().in('id',ids);if(error)throw error}
await batch('books',booksUp.map(toBook));await batch('reading_sessions',logsUp.map(toLog));await batch('book_loans',loansUp.map(toLoan));await del('reading_sessions',old.logs.filter(x=>!nextLogs.has(x.id)).map(x=>x.id));await del('book_loans',(old.loans||[]).filter(x=>!nextLoans.has(x.id)).map(x=>x.id));await del('books',old.books.filter(x=>!nextBooks.has(x.id)).map(x=>x.id));if(snapshot.goal!==old.goal){let{error}=await cloudClient.auth.updateUser({data:{reading_goal:snapshot.goal}});if(error)throw error}serverShadow=clone(snapshot)}
function queueSync(snapshot){setSync('저장 중…');pendingSync=pendingSync.catch(()=>{}).then(async()=>{try{await syncSnapshot(snapshot);setSync('✓ 동기화됨')}catch(err){setSync('⚠ 동기화 실패',true);console.error('Sync failed',err);alert('클라우드 저장 실패: '+err.message+'\n현재 화면을 닫지 말고 네트워크 및 권한을 확인해 주세요.');throw err}})}



// Photos are hosted in a public-read Supabase Storage bucket named book-covers.
// Upload paths are scoped to the authenticated user's UUID. The REST API key is never exposed.
async function uploadBookCoverPhoto(file){
 if(!cloudClient||!cloudUser)throw Error('Supabase 로그인이 필요해요.');
 const allowed={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'};
 if(!allowed[file.type]||file.size>5*1024*1024)throw Error('JPG·PNG·WebP 형식, 5MB 이하 파일만 가능해요.');
 const path=cloudUser.id+'/'+uid()+'.'+allowed[file.type];
 const {error}=await cloudClient.storage.from('book-covers').upload(path,file,{contentType:file.type,cacheControl:'3600',upsert:false});
 if(error)throw Error(error.message+' (Storage 버킷 및 정책을 확인해 주세요)');
 const {data}=cloudClient.storage.from('book-covers').getPublicUrl(path);
 if(!data?.publicUrl)throw Error('업로드된 표지 URL을 가져오지 못했습니다.');
 return data.publicUrl;
}

// Cover lookup works only for valid ISBN and saves only the cover_url field.
async function findBookCover(isbn){
 const code=String(isbn||'').replace(/[^0-9Xx]/g,'');
 if(!/^(\d{13}|\d{9}[\dXx])$/.test(code))return '';
 const kakao=async()=>{const results=await fetchKakaoBooks(code,'isbn');const match=results.find(x=>String(x.isbn||'').replace(/[^0-9X]/gi,'').toUpperCase()===code.toUpperCase());return match?.cover||''};
 const google=async()=>{
  const r=await fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+encodeURIComponent(code),{signal:AbortSignal.timeout(12000)});
  if(!r.ok)return '';
  const data=await r.json();
  const books=data.items||[];
  const same=books.find(item=>(item.volumeInfo?.industryIdentifiers||[]).some(x=>String(x.identifier||'').replace(/[^0-9Xx]/g,'').toUpperCase()===code.toUpperCase()));
  const img=same?.volumeInfo?.imageLinks;
  return (img?.thumbnail||img?.smallThumbnail||'').replace(/^http:/,'https:');
 };
 const openLibrary=async()=>{
  const r=await fetch('https://openlibrary.org/isbn/'+encodeURIComponent(code)+'.json',{signal:AbortSignal.timeout(12000)});
  if(!r.ok)return '';
  const book=await r.json();
  return book.covers?.length?'https://covers.openlibrary.org/b/id/'+encodeURIComponent(book.covers[0])+'-M.jpg':'';
 };
 try{const result=await kakao();if(result)return result}catch(e){console.warn('Kakao Books cover lookup:',e)}
 try{const result=await google();if(result)return result}catch(e){console.warn('Google Books cover lookup:',e)}
 try{return await openLibrary()}catch(e){console.warn('Open Library cover lookup:',e);return ''}
}
let coverBatchRunning=false;
async function fillMissingCovers(){
 if(coverBatchRunning||!cloudUser||!cloudClient)return;
 const targets=db.books.filter(b=>!b.cover&&/^(\d{13}|\d{9}[\dXx])$/.test(String(b.isbn||'').replace(/[^0-9Xx]/g,'')));
 const noIsbn=db.books.filter(b=>!b.cover).length-targets.length;
 if(!targets.length){alert('자동 검색할 책이 없어요. 표지가 없고 ISBN이 등록된 책만 검색합니다.');return}
 if(!confirm(`표지가 없는 책 ${targets.length}권을 검색할까요?\nISBN이 없는 책 ${noIsbn}권은 건너뜁니다.\n기존 표지는 변경하지 않습니다.`))return;
 const btn=$('fillCovers'),status=$('coverBatchStatus');
 coverBatchRunning=true;btn.disabled=true;let done=0,found=0,notFound=0,failed=0;
 const accountId=cloudUser.id;
 function progress(){if(status)status.textContent=`검색 ${done}/${targets.length}권 · 표지 저장 ${found}권 · 미발견 ${notFound}권 · 오류 ${failed}권`}
 progress();
 async function worker(){
  while(true){const i=doneIndex++;if(i>=targets.length)return;
   const b=targets[i];
   try{
    if(!cloudUser||cloudUser.id!==accountId)throw Error('로그인이 변경됨');
    const url=await findBookCover(b.isbn);
    if(url){
      const {data,error}=await cloudClient.from('books').update({cover_url:url}).eq('id',b.id).eq('user_id',accountId).select('id');
      if(error)throw error;
      if(!data?.length)throw Error('표지 저장 대상이 없습니다');
      b.cover=url;found++;
    }else notFound++;
   }catch(e){console.warn('Cover update failed:',b.title,e);failed++}
   done++;progress();
  }
 }
 let doneIndex=0;
 try{await Promise.all(Array.from({length:Math.min(3,targets.length)},()=>worker()));
  // Sync diff baseline with directly persisted covers to prevent later accidental overwrites.
  for(const book of serverShadow.books){const local=db.books.find(b=>b.id===book.id);if(local&&local.cover)book.cover=local.cover}
  render();
  // render() destroys settings status; restore settings tab and show the actual outcome.
  if(tab==='settings'){$('coverBatchStatus').textContent=`완료: 표지 ${found}권 저장 · 미발견 ${notFound}권 · 오류 ${failed}권 (검색 ${done}권)`}
  alert(`표지 검색 완료!\n새로 저장 ${found}권\n표지 미발견 ${notFound}권\n오류 ${failed}권\n기존 책과 독서 기록은 유지했어요.`);
 }finally{coverBatchRunning=false;const next=$('fillCovers');if(next)next.disabled=false}
}

startCloud();
